secret: JMal0XJRROOMsMdPqggG2tR56CTkpgN3r47GgUN/WSQ=

default:
  levels:
    - duration: 24h
      type: none
    - duration: 30m
      type: pow

frontend:
  my_fancy_frontend:
    # normally, the exact host is stored and examined during cookie validation
    # to allow a domain including all of its subdomains to share a validated session, list it here
    trusted_domains:
      - foo.example.com
    levels:
      - duration: 30s
        type: none
        countdown: 9  # default is 3 seconds, maximum is 9
      - duration: 20s
        type: pow
      - duration: 10s
        type: pow
        countdown: 0
      # captcha levels (turnstile, hcaptcha, recaptcha, cap) verify the widget
      # token against the provider, so the agent needs outbound HTTPS access
      - duration: 12h
        type: turnstile
        sitekey: 1x00000000000000000000AA               # dummy sitekey, always passes
        secret: 1x0000000000000000000000000000000AA     # dummy secret, always passes
      - duration: 240s  # nb: this must be long enough to cover the time to captcha completion
        type: cap
        sitekey: b125d3f13a
        secret: sk-xxx
        verify_url: https://captcha.example.com/b125d3f13a/siteverify # cap uses paths scoped to the sitekey
        skip_hostname_check: true # TODO: why?
        countdown: 1
